<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Opening Trainer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <meta name="theme-color" content="#2c1810">
</head>
<body>
    <div class="container">
        <!-- Sentence selector -->
        <div class="selector-container">
            <p class="instruction">
                I am
                <select id="color-select" class="select-input">
                    <option value="white">white</option>
                    <option value="black">black</option>
                </select>
                playing the
                <select id="opening-select" class="select-input">
                    <option value="caro-kann">Caro-Kann Defense</option>
                    <option value="giuoco-piano">Giuoco Piano</option>
                    <option value="italian-game" selected>Italian Game</option>
                    <option value="london-system">London System</option>
                    <option value="modern-defense">Modern Defense</option>
                    <option value="sicilian-defense">Sicilian Defense</option>
                </select>
                against
                <select id="variation-select" class="select-input">
                    <option value="pseudo-austrian-attack">Pseudo-Austrian Attack</option>
                </select>
            </p>
        </div>

        <!-- Training area -->
        <div class="training-container">
            <div class="board-container">
                <div class="board-wrapper">
                    <div id="board" class="chess-board"></div>
                </div>
            </div>

            <div class="info-container">
                <label class="toggle-label">
                    <input type="checkbox" id="hints-toggle" checked>
                    <span class="toggle-text">Show Hints</span>
                </label>

                <button id="reset-btn" class="reset-btn" title="Reset board">&#8635; Reset</button>

                <div class="nav-arrows">
                    <button id="back-btn" class="nav-arrow-btn" title="Go back one move">&#8592;</button>
                    <button id="forward-btn" class="nav-arrow-btn" title="Go forward one move">&#8594;</button>
                </div>

                <details class="resource-links">
                    <summary class="resource-dropdown-title">Learning Resources</summary>
                    <div class="resource-links-content">
                        <a href="notation-guide.html" class="resource-link">
                            📖 Learn Chess Notation
                        </a>
                        <a href="chess-principles.html" class="resource-link">
                            ♟️ Chess Principles
                        </a>
                        <a href="middlegame-principles.html" class="resource-link">
                            ⚔️ Middle Game Principles
                        </a>
                    </div>
                </details>

            </div>
        </div>
    </div>

    <!-- Create Combination Modal -->
    <div id="combination-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create New Combination</h2>
                <button id="modal-close" class="modal-close">&times;</button>
            </div>

            <div id="modal-step-1" class="modal-step">
                <div class="modal-form-group">
                    <label for="combo-color">Play as:</label>
                    <select id="combo-color" class="modal-select">
                        <option value="white">White</option>
                        <option value="black">Black</option>
                    </select>
                </div>
                <div class="modal-form-group">
                    <label for="combo-opening">Opening:</label>
                    <select id="combo-opening" class="modal-select">
                        <option value="italian-game">Italian Game</option>
                        <option value="caro-kann">Caro-Kann Defense</option>
                    </select>
                </div>
                <button id="start-recording-btn" class="modal-button primary">Start Recording Moves</button>
            </div>

            <div id="modal-step-2" class="modal-step hidden">
                <div class="recording-indicator">
                    <span class="recording-dot"></span> Recording Mode
                </div>
                <div class="recording-board-container">
                    <div id="recording-board" class="chess-board recording-board"></div>
                </div>
                <div class="recorded-moves">
                    <h4>Recorded Moves:</h4>
                    <div id="recorded-moves-list">No moves yet</div>
                </div>
                <div class="modal-form-group">
                    <label for="combo-nickname">Nickname:</label>
                    <input type="text" id="combo-nickname" class="modal-input" placeholder="e.g. Fried Liver Attack">
                </div>
                <div class="modal-actions">
                    <button id="undo-move-btn" class="modal-button secondary">Undo Last Move</button>
                    <button id="finish-recording-btn" class="modal-button primary">Finish & Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p class="loading-text">Loading openings...</p>
        </div>
    </div>

    <!-- Chess.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <!-- Opening registry (must load first) -->
    <script src="openings.js"></script>

    <!-- Individual opening definitions (add new opening files here) -->
    <script src="openings/caro-kann.js"></script>
    <script src="openings/italian-game.js"></script>

    <!-- Main application -->
    <script src="app.js"></script>
</body>
</html>
