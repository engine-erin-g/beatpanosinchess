<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Combinations - Chess Opening Trainer</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .manage-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .manage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #8b7355;
        }

        .manage-header h1 {
            margin: 0;
            color: #3d2817;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .back-link {
            color: #8b7355;
            text-decoration: none;
            font-family: 'Georgia', serif;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-link:hover {
            color: #3d2817;
        }

        .create-new-btn {
            display: block;
            width: 100%;
            background: #3d6b3d;
            color: #fefdfb;
            border: 2px solid #2d4d2d;
            padding: 15px 20px;
            font-size: 1em;
            font-family: 'Georgia', serif;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .create-new-btn:hover {
            background: #2d4d2d;
        }

        .combinations-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .opening-group {
            background: #faf9f7;
            border: 2px solid #8b7355;
            padding: 15px;
        }

        .opening-group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #8b7355;
        }

        .opening-group-header h2 {
            margin: 0;
            color: #3d2817;
            font-size: 1.1em;
            font-weight: normal;
        }

        .variation-count {
            color: #8b7355;
            font-size: 0.9em;
        }

        .variation-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #fefdfb;
            border: 1px solid #d4c4b0;
            margin-bottom: 10px;
        }

        .variation-item:last-child {
            margin-bottom: 0;
        }

        .variation-info {
            flex: 1;
        }

        .variation-name {
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            color: #3d2817;
            margin-bottom: 5px;
        }

        .variation-details {
            font-size: 0.85em;
            color: #8b7355;
        }

        .variation-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            font-family: 'Georgia', serif;
            font-size: 0.85em;
            padding: 8px 15px;
            border: 2px solid;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .action-btn.edit {
            background: #8b7355;
            color: #fefdfb;
            border-color: #6d5a44;
        }

        .action-btn.edit:hover {
            background: #6d5a44;
        }

        .action-btn.delete {
            background: #cc4444;
            color: #fefdfb;
            border-color: #aa3333;
        }

        .action-btn.delete:hover {
            background: #aa3333;
        }

        .no-combinations {
            text-align: center;
            padding: 40px;
            color: #8b7355;
            font-style: italic;
        }

        .no-combinations a {
            color: #3d6b3d;
        }

        /* Edit Modal */
        .edit-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .edit-modal.active {
            display: flex;
        }

        .edit-modal-content {
            background: #fefdfb;
            border: 3px solid #8b7355;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .edit-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #3d2817;
            color: #fefdfb;
            border-bottom: 2px solid #8b7355;
        }

        .edit-modal-header h2 {
            margin: 0;
            font-size: 1.2em;
            font-weight: normal;
        }

        .edit-modal-close {
            background: none;
            border: none;
            color: #fefdfb;
            font-size: 1.8em;
            cursor: pointer;
            line-height: 1;
        }

        .edit-modal-close:hover {
            color: #d4af37;
        }

        .edit-modal-body {
            padding: 20px;
        }

        .edit-sequence-item {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin-bottom: 15px;
            padding: 10px;
            background: #faf9f7;
            border: 1px solid #d4c4b0;
        }

        .edit-move-number {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #8b7355;
            min-width: 30px;
        }

        .edit-move-info {
            flex: 1;
        }

        .edit-move-san {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #3d2817;
            margin-bottom: 5px;
        }

        .edit-instruction-input {
            width: 100%;
            padding: 8px;
            font-family: 'Georgia', serif;
            font-size: 0.9em;
            border: 1px solid #8b7355;
            background: #fefdfb;
        }

        .edit-instruction-input:focus {
            outline: none;
            border-color: #3d2817;
        }

        .edit-modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            padding-top: 15px;
            border-top: 2px solid #8b7355;
            margin-top: 15px;
        }

        .save-btn {
            background: #3d6b3d;
            color: #fefdfb;
            border-color: #2d4d2d;
        }

        .save-btn:hover {
            background: #2d4d2d;
        }

        .cancel-btn {
            background: #8b7355;
            color: #fefdfb;
            border-color: #6d5a44;
        }

        .cancel-btn:hover {
            background: #6d5a44;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .manage-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .variation-item {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }

            .variation-actions {
                justify-content: flex-end;
            }

            .edit-modal-actions {
                flex-direction: column;
            }

            .action-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="manage-container">
        <div class="manage-header">
            <h1>Manage Combinations</h1>
            <a href="index.html" class="back-link">&larr; Back to Training</a>
        </div>

        <button id="create-new-btn" class="create-new-btn">+ Create New Combination</button>

        <div id="combinations-list" class="combinations-list">
            <!-- Combinations will be loaded here -->
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="edit-modal">
        <div class="edit-modal-content">
            <div class="edit-modal-header">
                <h2 id="edit-modal-title">Edit Combination</h2>
                <button id="edit-modal-close" class="edit-modal-close">&times;</button>
            </div>
            <div id="edit-modal-body" class="edit-modal-body">
                <!-- Edit form will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Create Combination Modal -->
    <div id="combination-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create New Combination</h2>
                <button id="modal-close" class="modal-close">&times;</button>
            </div>
            <div id="modal-step-1" class="modal-step">
                <div class="modal-form-group">
                    <label for="combo-color">Play as:</label>
                    <select id="combo-color" class="modal-select">
                        <option value="white">White</option>
                        <option value="black">Black</option>
                    </select>
                </div>
                <div class="modal-form-group">
                    <label for="combo-opening">Opening:</label>
                    <select id="combo-opening" class="modal-select">
                        <option value="italian-game">Italian Game</option>
                    </select>
                </div>
                <button id="start-recording-btn" class="modal-button primary">Start Recording Moves</button>
            </div>
            <div id="modal-step-2" class="modal-step hidden">
                <div class="recording-indicator">
                    <span class="recording-dot"></span> Recording Mode
                </div>
                <div class="recording-board-container">
                    <div id="recording-board" class="chess-board recording-board"></div>
                </div>
                <div class="recorded-moves">
                    <h4>Recorded Moves:</h4>
                    <div id="recorded-moves-list">No moves yet</div>
                </div>
                <div class="modal-form-group">
                    <label for="combo-nickname">Nickname:</label>
                    <input type="text" id="combo-nickname" class="modal-input" placeholder="e.g. Fried Liver Attack">
                </div>
                <div class="modal-actions">
                    <button id="undo-move-btn" class="modal-button secondary">Undo Last Move</button>
                    <button id="finish-recording-btn" class="modal-button primary">Finish & Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Chess.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <!-- Opening registry -->
    <script src="openings.js"></script>
    <script src="openings/caro-kann.js"></script>
    <script src="openings/italian-game.js"></script>

    <script>
        // Current editing state
        let currentEditOpening = null;
        let currentEditVariation = null;

        // Load and display combinations
        async function loadCombinations() {
            const snapshot = await db.collection('customVariations').get();
            const customStored = {};
            snapshot.forEach(doc => {
                customStored[doc.id] = doc.data();
            });
            const container = document.getElementById('combinations-list');

            // Combine all variations (use custom overrides when available)
            const allVariations = {};

            // Add variations from openingRegistry
            for (const [openingId, opening] of Object.entries(openingRegistry)) {
                if (!allVariations[openingId]) {
                    allVariations[openingId] = { name: opening.name, variations: {} };
                }
                for (const [variationId, variation] of Object.entries(opening.variations)) {
                    // Check if there's a custom override
                    const customOverride = customStored[openingId]?.[variationId];
                    if (customOverride && customOverride.deleted) {
                        // Skip deleted variations
                        continue;
                    } else if (customOverride) {
                        allVariations[openingId].variations[variationId] = {
                            ...customOverride,
                            name: variation.name || variationId
                        };
                    } else if (!variation.isCustom) {
                        allVariations[openingId].variations[variationId] = {
                            ...variation,
                            data: openings[`${openingId}:${variationId}`]
                        };
                    }
                }
            }

            // Add custom variations that aren't overrides
            for (const [openingId, variations] of Object.entries(customStored)) {
                if (!allVariations[openingId]) {
                    allVariations[openingId] = { name: formatOpeningName(openingId), variations: {} };
                }
                for (const [variationId, variation] of Object.entries(variations)) {
                    if (variation.deleted) continue;
                    // Only add if not already present (not an override)
                    if (!allVariations[openingId].variations[variationId]) {
                        allVariations[openingId].variations[variationId] = variation;
                    }
                }
            }

            let hasAny = false;
            let html = '';

            // Sort openings alphabetically by name
            const sortedOpenings = Object.entries(allVariations).sort((a, b) => {
                const nameA = (a[1].name || formatOpeningName(a[0])).toLowerCase();
                const nameB = (b[1].name || formatOpeningName(b[0])).toLowerCase();
                return nameA.localeCompare(nameB);
            });

            for (const [openingId, opening] of sortedOpenings) {
                const variations = Object.entries(opening.variations);
                if (variations.length === 0) continue;
                hasAny = true;

                // Sort variations alphabetically by name
                const sortedVariations = variations.sort((a, b) => {
                    const nameA = (a[1].name || a[0]).toLowerCase();
                    const nameB = (b[1].name || b[0]).toLowerCase();
                    return nameA.localeCompare(nameB);
                });

                html += `
                    <div class="opening-group">
                        <div class="opening-group-header">
                            <h2>${opening.name || formatOpeningName(openingId)}</h2>
                            <span class="variation-count">${sortedVariations.length} variation${sortedVariations.length !== 1 ? 's' : ''}</span>
                        </div>
                `;

                for (const [variationId, variation] of sortedVariations) {
                    // Get sequence info
                    let sequences = [];
                    let playAs = 'White';

                    if (variation.data) {
                        if (variation.data.playAsWhite) {
                            sequences = variation.data.playAsWhite;
                            playAs = 'White';
                        } else if (variation.data.playAsBlack) {
                            sequences = variation.data.playAsBlack;
                            playAs = 'Black';
                        }
                    } else if (variation.sequences) {
                        const sequenceKey = Object.keys(variation.sequences)[0];
                        sequences = variation.sequences[sequenceKey] || [];
                        playAs = sequenceKey === 'playAsWhite' ? 'White' : 'Black';
                    }

                    const moveCount = sequences.filter(s => s.move !== null).length;

                    const nickname = variation.nickname || '';
                    const displayName = nickname ? `${nickname} (${variationId})` : variationId;

                    html += `
                        <div class="variation-item">
                            <div class="variation-info">
                                <div class="variation-name">${displayName}</div>
                                <div class="variation-details">
                                    Play as ${playAs} | ${moveCount} moves
                                </div>
                            </div>
                            <div class="variation-actions">
                                <button class="action-btn edit" onclick="editCombination('${openingId}', '${variationId}')">Edit</button>
                                <button class="action-btn delete" onclick="deleteCombination('${openingId}', '${variationId}')">Delete</button>
                            </div>
                        </div>
                    `;
                }

                html += '</div>';
            }

            if (!hasAny) {
                container.innerHTML = `
                    <div class="no-combinations">
                        <p>No combinations found.</p>
                        <p>Click "Create New Combination" to add one!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = html;
        }

        // Format opening ID to display name
        function formatOpeningName(openingId) {
            return openingId
                .split('-')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        // Delete combination
        async function deleteCombination(openingId, variationId) {
            const btn = event.target;
            if (btn.dataset.confirming !== 'true') {
                btn.dataset.confirming = 'true';
                btn.textContent = 'Confirm?';
                setTimeout(() => {
                    btn.dataset.confirming = 'false';
                    btn.textContent = 'Delete';
                }, 3000);
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Deleting...';

            try {
                const docRef = db.collection('customVariations').doc(openingId);
                const doc = await docRef.get();
                const stored = doc.exists ? doc.data() : {};

                if (stored[variationId] && stored[variationId].isCustom) {
                    // Custom variation — remove the field entirely
                    await docRef.update({
                        [variationId]: firebase.firestore.FieldValue.delete()
                    });
                } else {
                    // Built-in variation — store a deleted marker to hide it
                    await docRef.set({ [variationId]: { deleted: true } }, { merge: true });
                }

                loadCombinations();
            } catch (err) {
                console.error('Delete failed:', err);
                alert('Delete failed: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'Delete';
            }
        }

        // Edit combination
        async function editCombination(openingId, variationId) {
            currentEditOpening = openingId;
            currentEditVariation = variationId;

            const doc = await db.collection('customVariations').doc(openingId).get();
            const storedData = doc.exists ? doc.data() : {};
            const currentNickname = storedData[variationId]?.nickname || '';

            document.getElementById('edit-modal-title').textContent = 'Edit Combination';

            const html = `
                <p style="color: #8b7355; font-family: 'Courier New', monospace; margin-bottom: 15px;">${variationId}</p>
                <label style="display: block; margin-bottom: 8px; color: #3d2817; font-family: Georgia, serif;">Nickname:</label>
                <input type="text" id="edit-nickname-input" class="edit-instruction-input"
                       value="${escapeHtml(currentNickname)}"
                       placeholder="e.g. Fried Liver Attack">
                <div class="edit-modal-actions">
                    <button class="action-btn cancel-btn" onclick="closeEditModal()">Cancel</button>
                    <button class="action-btn save-btn" onclick="saveEdit()">Save Changes</button>
                </div>
            `;

            document.getElementById('edit-modal-body').innerHTML = html;
            document.getElementById('edit-modal').classList.add('active');
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replace(/"/g, '&quot;');
        }

        // Close edit modal
        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('active');
            currentEditOpening = null;
            currentEditVariation = null;
        }

        // Save edit
        async function saveEdit() {
            if (!currentEditOpening || !currentEditVariation) return;

            const nickname = document.getElementById('edit-nickname-input').value.trim();

            await db.collection('customVariations').doc(currentEditOpening).set({
                [currentEditVariation]: { nickname: nickname || null }
            }, { merge: true });

            closeEditModal();
            loadCombinations();
        }

        // ============================================================
        // CREATE COMBINATION MODAL
        // ============================================================

        const pieces = {
            'wK': '♔', 'wQ': '♕', 'wR': '♖', 'wB': '♗', 'wN': '♘', 'wP': '♙',
            'bK': '♚', 'bQ': '♛', 'bR': '♜', 'bB': '♝', 'bN': '♞', 'bP': '♟'
        };

        let recordingGame = null;
        let recordingColor = 'white';
        let recordingOpening = 'italian-game';
        let recordedMoves = [];
        let recordingSelectedSquare = null;

        function openModal() {
            document.getElementById('combination-modal').classList.add('active');
            document.getElementById('modal-step-1').classList.remove('hidden');
            document.getElementById('modal-step-2').classList.add('hidden');
            document.getElementById('combo-color').value = 'white';
            updateOpeningForColor();
        }

        function closeModal() {
            document.getElementById('combination-modal').classList.remove('active');
            recordingGame = null;
            recordedMoves = [];
            recordingSelectedSquare = null;
            const nicknameInput = document.getElementById('combo-nickname');
            if (nicknameInput) nicknameInput.value = '';
        }

        function updateOpeningForColor() {
            const color = document.getElementById('combo-color').value;
            const openingSelect = document.getElementById('combo-opening');
            if (color === 'white') {
                openingSelect.innerHTML = '<option value="italian-game">Italian Game</option>';
            } else {
                openingSelect.innerHTML = '<option value="caro-kann">Caro-Kann Defense</option>';
            }
        }

        function startRecording() {
            recordingOpening = document.getElementById('combo-opening').value;
            recordingColor = document.getElementById('combo-color').value;
            recordingGame = new Chess();
            recordedMoves = [];
            recordingSelectedSquare = null;

            if (recordingColor === 'black') {
                recordedMoves.push({ move: null });
            }

            document.getElementById('modal-step-1').classList.add('hidden');
            document.getElementById('modal-step-2').classList.remove('hidden');
            createRecordingBoard();
            updateRecordedMovesList();
        }

        function createRecordingBoard() {
            const boardElement = document.getElementById('recording-board');
            boardElement.innerHTML = '';
            const files = recordingColor === 'white' ? ['a','b','c','d','e','f','g','h'] : ['h','g','f','e','d','c','b','a'];
            const ranks = recordingColor === 'white' ? ['8','7','6','5','4','3','2','1'] : ['1','2','3','4','5','6','7','8'];
            ranks.forEach((rank, rankIndex) => {
                files.forEach((file, fileIndex) => {
                    const square = document.createElement('div');
                    const squareId = file + rank;
                    square.id = 'rec-' + squareId;
                    square.className = 'square ' + ((rankIndex + fileIndex) % 2 === 0 ? 'light' : 'dark');
                    square.addEventListener('click', () => handleRecordingSquareClick(squareId));
                    boardElement.appendChild(square);
                });
            });
            updateRecordingBoard();
        }

        function updateRecordingBoard() {
            const board = recordingGame.board();
            const files = ['a','b','c','d','e','f','g','h'];
            for (let rank = 0; rank < 8; rank++) {
                for (let file = 0; file < 8; file++) {
                    const piece = board[rank][file];
                    const squareId = files[file] + (8 - rank);
                    const squareElement = document.getElementById('rec-' + squareId);
                    if (!squareElement) continue;
                    if (piece) {
                        const color = piece.color === 'w' ? 'w' : 'b';
                        const type = piece.type.toUpperCase();
                        squareElement.textContent = pieces[color + type];
                        squareElement.className = squareElement.className.replace(/ (white|black)-piece/g, '');
                        squareElement.classList.add(color === 'w' ? 'white-piece' : 'black-piece');
                    } else {
                        squareElement.textContent = '';
                        squareElement.className = squareElement.className.replace(/ (white|black)-piece/g, '');
                    }
                }
            }
        }

        function handleRecordingSquareClick(squareId) {
            if (recordingGame.game_over()) return;
            if (!recordingSelectedSquare) {
                const piece = recordingGame.get(squareId);
                if (piece) {
                    recordingSelectedSquare = squareId;
                    document.getElementById('rec-' + squareId).classList.add('selected');
                }
            } else {
                const move = recordingGame.move({ from: recordingSelectedSquare, to: squareId, promotion: 'q' });
                document.getElementById('rec-' + recordingSelectedSquare).classList.remove('selected');
                if (move) {
                    const isUserMove = (move.color === 'w' && recordingColor === 'white') ||
                                       (move.color === 'b' && recordingColor === 'black');
                    recordedMoves.push(isUserMove ? { move: move.san } : { move: move.san, isComputerMove: true });
                    updateRecordingBoard();
                    updateRecordedMovesList();
                } else if (squareId !== recordingSelectedSquare) {
                    const piece = recordingGame.get(squareId);
                    if (piece) {
                        recordingSelectedSquare = squareId;
                        document.getElementById('rec-' + squareId).classList.add('selected');
                        return;
                    }
                }
                recordingSelectedSquare = null;
            }
        }

        function undoRecordingMove() {
            if (recordedMoves.length === 0) return;
            const last = recordedMoves[recordedMoves.length - 1];
            if (last.move === null) {
                recordedMoves.pop();
            } else {
                recordingGame.undo();
                recordedMoves.pop();
            }
            updateRecordingBoard();
            updateRecordedMovesList();
        }

        function updateRecordedMovesList() {
            const movesList = document.getElementById('recorded-moves-list');
            if (recordedMoves.length === 0) { movesList.innerHTML = 'No moves yet'; return; }
            let html = '';
            for (const recorded of recordedMoves) {
                if (recorded.move === null) {
                    html += `<div style="color:#666;font-style:italic;">Start position</div>`;
                } else {
                    html += `<span>${recorded.isComputerMove ? '🖥️ ' : ''}${recorded.move}</span> `;
                }
            }
            movesList.innerHTML = html;
        }

        async function finishRecording() {
            if (recordedMoves.filter(m => m.move !== null).length === 0) {
                alert('Please record at least one move');
                return;
            }

            const sequenceKey = 'playAs' + recordingColor.charAt(0).toUpperCase() + recordingColor.slice(1);
            const userSequences = [];
            const computerMovesList = [];

            for (const recorded of recordedMoves) {
                if (recorded.move === null) {
                    userSequences.push({ move: null });
                } else if (recorded.isComputerMove) {
                    computerMovesList.push(recorded.move);
                } else {
                    userSequences.push({ move: recorded.move });
                }
            }

            const variationName = computerMovesList.join('-');
            if (!variationName) { alert('Please record at least one opponent move'); return; }

            const fullId = `${recordingOpening}:${variationName}`;
            if (openings[fullId]) {
                alert(`A variation "${variationName}" already exists for this opening.`);
                return;
            }

            const nickname = document.getElementById('combo-nickname').value.trim();
            const variation = {
                name: variationName,
                nickname: nickname || null,
                openingId: recordingOpening,
                isCustom: true,
                sequences: { [sequenceKey]: userSequences },
                computerMoves: { [sequenceKey]: computerMovesList }
            };

            try {
                await db.collection('customVariations').doc(recordingOpening).set(
                    { [variationName]: variation },
                    { merge: true }
                );
                // Register locally so duplicate check works within the same session
                openings[fullId] = { name: variationName, isCustom: true, ...variation.sequences };
                closeModal();
                loadCombinations();
            } catch (err) {
                console.error('Save failed:', err);
                alert('Save failed: ' + err.message);
            }
        }

        // Wire up modal buttons
        document.getElementById('create-new-btn').addEventListener('click', openModal);
        document.getElementById('modal-close').addEventListener('click', closeModal);
        document.getElementById('combination-modal').addEventListener('click', (e) => {
            if (e.target.id === 'combination-modal') closeModal();
        });
        document.getElementById('combo-color').addEventListener('change', updateOpeningForColor);
        document.getElementById('start-recording-btn').addEventListener('click', startRecording);
        document.getElementById('undo-move-btn').addEventListener('click', undoRecordingMove);
        document.getElementById('finish-recording-btn').addEventListener('click', finishRecording);

        // Edit modal event listeners
        document.getElementById('edit-modal-close').addEventListener('click', closeEditModal);
        document.getElementById('edit-modal').addEventListener('click', (e) => {
            if (e.target.id === 'edit-modal') closeEditModal();
        });

        // Initialize
        loadCombinations();
    </script>
</body>
</html>
