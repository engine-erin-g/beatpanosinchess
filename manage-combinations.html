<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Combinations - Chess Opening Trainer</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .manage-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .manage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #8b7355;
        }

        .manage-header h1 {
            margin: 0;
            color: #3d2817;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .back-link {
            color: #8b7355;
            text-decoration: none;
            font-family: 'Georgia', serif;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-link:hover {
            color: #3d2817;
        }

        .create-new-btn {
            display: block;
            width: 100%;
            background: #3d6b3d;
            color: #fefdfb;
            border: 2px solid #2d4d2d;
            padding: 15px 20px;
            font-size: 1em;
            font-family: 'Georgia', serif;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .create-new-btn:hover {
            background: #2d4d2d;
        }

        .combinations-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .opening-group {
            background: #faf9f7;
            border: 2px solid #8b7355;
            padding: 15px;
        }

        .opening-group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #8b7355;
        }

        .opening-group-header h2 {
            margin: 0;
            color: #3d2817;
            font-size: 1.1em;
            font-weight: normal;
        }

        .variation-count {
            color: #8b7355;
            font-size: 0.9em;
        }

        .variation-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #fefdfb;
            border: 1px solid #d4c4b0;
            margin-bottom: 10px;
        }

        .variation-item:last-child {
            margin-bottom: 0;
        }

        .variation-info {
            flex: 1;
        }

        .variation-name {
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            color: #3d2817;
            margin-bottom: 5px;
        }

        .variation-details {
            font-size: 0.85em;
            color: #8b7355;
        }

        .variation-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            font-family: 'Georgia', serif;
            font-size: 0.85em;
            padding: 8px 15px;
            border: 2px solid;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .action-btn.edit {
            background: #8b7355;
            color: #fefdfb;
            border-color: #6d5a44;
        }

        .action-btn.edit:hover {
            background: #6d5a44;
        }

        .action-btn.delete {
            background: #cc4444;
            color: #fefdfb;
            border-color: #aa3333;
        }

        .action-btn.delete:hover {
            background: #aa3333;
        }

        .no-combinations {
            text-align: center;
            padding: 40px;
            color: #8b7355;
            font-style: italic;
        }

        .no-combinations a {
            color: #3d6b3d;
        }

        /* Edit Modal */
        .edit-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .edit-modal.active {
            display: flex;
        }

        .edit-modal-content {
            background: #fefdfb;
            border: 3px solid #8b7355;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .edit-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #3d2817;
            color: #fefdfb;
            border-bottom: 2px solid #8b7355;
        }

        .edit-modal-header h2 {
            margin: 0;
            font-size: 1.2em;
            font-weight: normal;
        }

        .edit-modal-close {
            background: none;
            border: none;
            color: #fefdfb;
            font-size: 1.8em;
            cursor: pointer;
            line-height: 1;
        }

        .edit-modal-close:hover {
            color: #d4af37;
        }

        .edit-modal-body {
            padding: 20px;
        }

        .edit-sequence-item {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin-bottom: 15px;
            padding: 10px;
            background: #faf9f7;
            border: 1px solid #d4c4b0;
        }

        .edit-move-number {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #8b7355;
            min-width: 30px;
        }

        .edit-move-info {
            flex: 1;
        }

        .edit-move-san {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #3d2817;
            margin-bottom: 5px;
        }

        .edit-instruction-input {
            width: 100%;
            padding: 8px;
            font-family: 'Georgia', serif;
            font-size: 0.9em;
            border: 1px solid #8b7355;
            background: #fefdfb;
        }

        .edit-instruction-input:focus {
            outline: none;
            border-color: #3d2817;
        }

        .edit-modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            padding-top: 15px;
            border-top: 2px solid #8b7355;
            margin-top: 15px;
        }

        .save-btn {
            background: #3d6b3d;
            color: #fefdfb;
            border-color: #2d4d2d;
        }

        .save-btn:hover {
            background: #2d4d2d;
        }

        .cancel-btn {
            background: #8b7355;
            color: #fefdfb;
            border-color: #6d5a44;
        }

        .cancel-btn:hover {
            background: #6d5a44;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .manage-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .variation-item {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }

            .variation-actions {
                justify-content: flex-end;
            }

            .edit-modal-actions {
                flex-direction: column;
            }

            .action-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="manage-container">
        <div class="manage-header">
            <h1>Manage Combinations</h1>
            <a href="index.html" class="back-link">&larr; Back to Training</a>
        </div>

        <button id="create-new-btn" class="create-new-btn">+ Create New Combination</button>

        <div id="combinations-list" class="combinations-list">
            <!-- Combinations will be loaded here -->
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="edit-modal">
        <div class="edit-modal-content">
            <div class="edit-modal-header">
                <h2 id="edit-modal-title">Edit Combination</h2>
                <button id="edit-modal-close" class="edit-modal-close">&times;</button>
            </div>
            <div id="edit-modal-body" class="edit-modal-body">
                <!-- Edit form will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Chess.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <!-- Opening registry -->
    <script src="openings.js"></script>
    <script src="openings/caro-kann.js"></script>
    <script src="openings/italian-game.js"></script>

    <script>
        // Storage key
        const STORAGE_KEY = 'customVariations';

        // Current editing state
        let currentEditOpening = null;
        let currentEditVariation = null;

        // Load and display combinations
        function loadCombinations() {
            const customStored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            const container = document.getElementById('combinations-list');

            // Combine all variations (use custom overrides when available)
            const allVariations = {};

            // Add variations from openingRegistry
            for (const [openingId, opening] of Object.entries(openingRegistry)) {
                if (!allVariations[openingId]) {
                    allVariations[openingId] = { name: opening.name, variations: {} };
                }
                for (const [variationId, variation] of Object.entries(opening.variations)) {
                    // Check if there's a custom override
                    const customOverride = customStored[openingId]?.[variationId];
                    if (customOverride) {
                        allVariations[openingId].variations[variationId] = {
                            ...customOverride,
                            name: variation.name || variationId
                        };
                    } else if (!variation.isCustom) {
                        allVariations[openingId].variations[variationId] = {
                            ...variation,
                            data: openings[`${openingId}:${variationId}`]
                        };
                    }
                }
            }

            // Add custom variations that aren't overrides
            for (const [openingId, variations] of Object.entries(customStored)) {
                if (!allVariations[openingId]) {
                    allVariations[openingId] = { name: formatOpeningName(openingId), variations: {} };
                }
                for (const [variationId, variation] of Object.entries(variations)) {
                    // Only add if not already present (not an override)
                    if (!allVariations[openingId].variations[variationId]) {
                        allVariations[openingId].variations[variationId] = variation;
                    }
                }
            }

            let hasAny = false;
            let html = '';

            // Sort openings alphabetically by name
            const sortedOpenings = Object.entries(allVariations).sort((a, b) => {
                const nameA = (a[1].name || formatOpeningName(a[0])).toLowerCase();
                const nameB = (b[1].name || formatOpeningName(b[0])).toLowerCase();
                return nameA.localeCompare(nameB);
            });

            for (const [openingId, opening] of sortedOpenings) {
                const variations = Object.entries(opening.variations);
                if (variations.length === 0) continue;
                hasAny = true;

                // Sort variations alphabetically by name
                const sortedVariations = variations.sort((a, b) => {
                    const nameA = (a[1].name || a[0]).toLowerCase();
                    const nameB = (b[1].name || b[0]).toLowerCase();
                    return nameA.localeCompare(nameB);
                });

                html += `
                    <div class="opening-group">
                        <div class="opening-group-header">
                            <h2>${opening.name || formatOpeningName(openingId)}</h2>
                            <span class="variation-count">${sortedVariations.length} variation${sortedVariations.length !== 1 ? 's' : ''}</span>
                        </div>
                `;

                for (const [variationId, variation] of sortedVariations) {
                    // Get sequence info
                    let sequences = [];
                    let playAs = 'White';

                    if (variation.data) {
                        if (variation.data.playAsWhite) {
                            sequences = variation.data.playAsWhite;
                            playAs = 'White';
                        } else if (variation.data.playAsBlack) {
                            sequences = variation.data.playAsBlack;
                            playAs = 'Black';
                        }
                    } else if (variation.sequences) {
                        const sequenceKey = Object.keys(variation.sequences)[0];
                        sequences = variation.sequences[sequenceKey] || [];
                        playAs = sequenceKey === 'playAsWhite' ? 'White' : 'Black';
                    }

                    const moveCount = sequences.filter(s => s.move !== null).length;

                    html += `
                        <div class="variation-item">
                            <div class="variation-info">
                                <div class="variation-name">${variation.name || variationId}</div>
                                <div class="variation-details">
                                    Play as ${playAs} | ${moveCount} moves
                                </div>
                            </div>
                            <div class="variation-actions">
                                <button class="action-btn edit" onclick="editCombination('${openingId}', '${variationId}')">Edit</button>
                                <button class="action-btn delete" onclick="deleteCombination('${openingId}', '${variationId}')">Delete</button>
                            </div>
                        </div>
                    `;
                }

                html += '</div>';
            }

            if (!hasAny) {
                container.innerHTML = `
                    <div class="no-combinations">
                        <p>No combinations found.</p>
                        <p>Click "Create New Combination" to add one!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = html;
        }

        // Format opening ID to display name
        function formatOpeningName(openingId) {
            return openingId
                .split('-')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        // Delete combination
        function deleteCombination(openingId, variationId) {
            if (!confirm(`Are you sure you want to delete "${variationId}"?`)) {
                return;
            }

            const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

            // Check if it's in localStorage
            if (stored[openingId] && stored[openingId][variationId]) {
                delete stored[openingId][variationId];
                if (Object.keys(stored[openingId]).length === 0) {
                    delete stored[openingId];
                }
                localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
            } else {
                // It's a built-in, save a "deleted" marker
                if (!stored[openingId]) {
                    stored[openingId] = {};
                }
                stored[openingId][variationId] = { deleted: true };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
            }

            loadCombinations();
        }

        // Edit combination
        function editCombination(openingId, variationId) {
            currentEditOpening = openingId;
            currentEditVariation = variationId;

            const customStored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            let sequences, sequenceKey, variationName;

            // Check for custom override first
            const customOverride = customStored[openingId]?.[variationId];
            if (customOverride && customOverride.sequences) {
                sequenceKey = Object.keys(customOverride.sequences)[0];
                sequences = customOverride.sequences[sequenceKey] || [];
                variationName = customOverride.name || variationId;
            } else {
                // Get from built-in openings
                const fullId = `${openingId}:${variationId}`;
                const data = openings[fullId];
                if (!data) return;

                if (data.playAsWhite) {
                    sequences = data.playAsWhite;
                    sequenceKey = 'playAsWhite';
                } else if (data.playAsBlack) {
                    sequences = data.playAsBlack;
                    sequenceKey = 'playAsBlack';
                }
                variationName = data.variationName || variationId;
            }

            document.getElementById('edit-modal-title').textContent = 'Edit Combination';

            let html = `<h3 style="margin-top: 0; color: #3d2817;">${variationName}</h3>`;

            sequences.forEach((seq, index) => {
                if (seq.move === null) {
                    html += `
                        <div class="edit-sequence-item">
                            <div class="edit-move-number">Start</div>
                            <div class="edit-move-info">
                                <div class="edit-move-san">(Initial instruction)</div>
                                <input type="text" class="edit-instruction-input"
                                       data-index="${index}"
                                       value="${escapeHtml(seq.instruction || '')}"
                                       placeholder="Enter instruction...">
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="edit-sequence-item">
                            <div class="edit-move-number">${index}.</div>
                            <div class="edit-move-info">
                                <div class="edit-move-san">${seq.move}</div>
                                <input type="text" class="edit-instruction-input"
                                       data-index="${index}"
                                       value="${escapeHtml(seq.instruction || '')}"
                                       placeholder="Enter instruction...">
                            </div>
                        </div>
                    `;
                }
            });

            html += `
                <div class="edit-modal-actions">
                    <button class="action-btn cancel-btn" onclick="closeEditModal()">Cancel</button>
                    <button class="action-btn save-btn" onclick="saveEdit()">Save Changes</button>
                </div>
            `;

            document.getElementById('edit-modal-body').innerHTML = html;
            document.getElementById('edit-modal').classList.add('active');
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replace(/"/g, '&quot;');
        }

        // Close edit modal
        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('active');
            currentEditOpening = null;
            currentEditVariation = null;
        }

        // Save edit
        function saveEdit() {
            if (!currentEditOpening || !currentEditVariation) return;

            const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            const inputs = document.querySelectorAll('.edit-instruction-input');

            // Get the original data
            const fullId = `${currentEditOpening}:${currentEditVariation}`;
            const builtinData = openings[fullId];
            const existingCustom = stored[currentEditOpening]?.[currentEditVariation];

            let sequenceKey, sequences;

            if (existingCustom && existingCustom.sequences) {
                sequenceKey = Object.keys(existingCustom.sequences)[0];
                sequences = existingCustom.sequences[sequenceKey].map(s => ({...s}));
            } else if (builtinData) {
                if (builtinData.playAsWhite) {
                    sequenceKey = 'playAsWhite';
                    sequences = builtinData.playAsWhite.map(s => ({...s}));
                } else if (builtinData.playAsBlack) {
                    sequenceKey = 'playAsBlack';
                    sequences = builtinData.playAsBlack.map(s => ({...s}));
                }
            } else {
                return;
            }

            // Update instructions from inputs
            inputs.forEach(input => {
                const index = parseInt(input.dataset.index);
                if (sequences[index] !== undefined) {
                    sequences[index].instruction = input.value;
                }
            });

            // Get computer moves
            const computerMovesData = computerMoves[fullId] || (existingCustom && existingCustom.computerMoves);

            // Save to localStorage
            if (!stored[currentEditOpening]) {
                stored[currentEditOpening] = {};
            }

            stored[currentEditOpening][currentEditVariation] = {
                name: currentEditVariation,
                openingId: currentEditOpening,
                isCustom: true,
                sequences: {
                    [sequenceKey]: sequences
                },
                computerMoves: computerMovesData ? { [sequenceKey]: computerMovesData[sequenceKey] } : {}
            };

            localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
            closeEditModal();
            loadCombinations();
            alert('Changes saved successfully!');
        }

        // Create new button - redirect to main page
        document.getElementById('create-new-btn').addEventListener('click', () => {
            window.location.href = 'index.html#create';
        });

        // Event listeners
        document.getElementById('edit-modal-close').addEventListener('click', closeEditModal);
        document.getElementById('edit-modal').addEventListener('click', (e) => {
            if (e.target.id === 'edit-modal') closeEditModal();
        });

        // Initialize
        loadCombinations();
    </script>
</body>
</html>
